<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RELION cryo-ET</title>
    <script>
      /* Apply the stored theme before first paint so a dark-theme user does not see
   a white flash. Light is the default. The palette keys off data-theme, not a
   class. */
      (function () {
        try {
          if (localStorage.getItem("relion-web-theme") === "dark") {
            document.documentElement.dataset.theme = "dark";
          }
        } catch (e) {
          /* storage unavailable */
        }
      })();
    </script>
    <script type="module" crossorigin src="/assets/app.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
